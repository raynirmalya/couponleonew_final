proxy_cache_path /var/cache/nginx/couponleo-public levels=1:2 keys_zone=couponleo_public:20m max_size=512m inactive=24h use_temp_path=off;

server {
    listen 443 ssl http2;
    server_name couponleo.com www.couponleo.com;
    location = /google94823beaed3ffc8e.html {
        alias /var/www/couponleo-verification/google94823beaed3ffc8e.html;
        default_type text/html;
    }

    ssl_certificate /etc/letsencrypt/live/couponleo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/couponleo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Snapshot-backed public data keeps coupon grouping pages responsive under API load.
    location = /couponleo/api/seo/groupings {
        alias /srv/couponleo-seo-data/groupings.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /couponleo/api/seo/highlights {
        if ($arg_country !~ "^[a-z0-9-]+$") { return 400; }
        if ($arg_category !~ "^[a-z0-9-]*$") { return 400; }
        root /srv/couponleo-seo-data;
        try_files /highlights/$arg_country/$arg_category.json =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Public SEO data is shared by every visitor and safe to serve stale while updating.
    location ^~ /couponleo/api/seo/ {
        proxy_pass http://127.0.0.1:9600/couponleo/api/seo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_cache couponleo_public;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization $upstream_http_set_cookie;
        add_header X-CouponLeo-Data-Cache $upstream_cache_status always;
    }

    location /couponleo/api/ {
        proxy_pass http://127.0.0.1:9600/couponleo/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Public editorial and coupon landing pages are identical for anonymous visitors.
    location ~ ^/(top-coupons|blog)(/|$) {
        proxy_pass http://127.0.0.1:4173;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_hide_header Server-Timing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_cache couponleo_public;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $http_cookie $http_authorization $args;
        proxy_no_cache $http_cookie $http_authorization $args $upstream_http_set_cookie;
        add_header X-CouponLeo-Cache $upstream_cache_status always;
    }

    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        proxy_pass http://127.0.0.1:4173;
        proxy_hide_header Server-Timing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(assets/images|images)/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_hide_header Server-Timing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        # Bound upstream header buffers and keep internal timing diagnostics private.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_hide_header Server-Timing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    server_name couponleo.com www.couponleo.com;
    location = /google94823beaed3ffc8e.html {
        alias /var/www/couponleo-verification/google94823beaed3ffc8e.html;
        default_type text/html;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
